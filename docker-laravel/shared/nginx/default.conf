server {
    listen 80;
    client_max_body_size 2G;
    index index.php index.html;
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
    root /var/www/public;

    # Compress text responses. Matters enormously on slow/high-latency links:
    # the dashboard HTML is ~600 KB uncompressed (~96 KB gzipped) and a single
    # /api/conversations response can be several MB of JSON.
    # text/event-stream is deliberately NOT listed: SSE must stay unbuffered.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass pocket-dev-php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # Disable buffering for SSE streaming support
        fastcgi_buffering off;

        # Timeouts for SSE streaming connections.
        # Must exceed the SSE endpoint's connection timeout (600s)
        # so nginx doesn't kill PHP-FPM connections before the app does.
        fastcgi_read_timeout 3600s;
        fastcgi_send_timeout 3600s;
        fastcgi_connect_timeout 10s;
    }

    # Vite output carries a content hash in every filename, so these can be
    # cached indefinitely. Without this the browser refetches ~320 KB of JS/CSS
    # on every page load. ^~ keeps the .php regex block from taking over.
    location ^~ /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        gzip_static on;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
        gzip_static on;
    }
}