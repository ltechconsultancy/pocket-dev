# PocketDev for Coolify — GitHub app, build from repo (no GHCR pull).
#
# Coolify: Docker Compose (not Raw) → compose file: deploy/compose.coolify.yml
# FQDN on pocket-dev-nginx → port 80. No custom networks. No Traefik labels here.
# Env: Coolify → Environment tab (or ./setup-coolify.sh).
# Coolify writes project-root .env — use env_file (do NOT mount .env: path; Coolify creates empty *_env volume).
#
# Build context ".." = repository root (this file is in deploy/).

x-pocketdev-env: &pocketdev-env
  PD_APP_KEY: ${PD_APP_KEY:?set PD_APP_KEY}
  PD_APP_ENV: ${PD_APP_ENV:-production}
  PD_APP_DEBUG: ${PD_APP_DEBUG:-false}
  PD_APP_URL: ${PD_APP_URL:?set PD_APP_URL}
  PD_FORCE_HTTPS: ${PD_FORCE_HTTPS:-true}
  PD_DOMAIN_NAME: ${PD_DOMAIN_NAME:-localhost}
  PD_DEPLOYMENT_MODE: ${PD_DEPLOYMENT_MODE:-production}
  PD_PROJECT_NAME: ${PD_PROJECT_NAME:-pocket-dev}
  PD_DB_CONNECTION: ${PD_DB_CONNECTION:-pgsql}
  PD_DB_HOST: ${PD_DB_HOST:-pocket-dev-postgres}
  PD_DB_PORT: ${PD_DB_PORT:-5432}
  PD_DB_DATABASE: ${PD_DB_DATABASE:-pocket-dev}
  PD_DB_USERNAME: ${PD_DB_USERNAME:-pocket-dev}
  PD_DB_PASSWORD: ${PD_DB_PASSWORD:?set PD_DB_PASSWORD}
  PD_DB_READONLY_PASSWORD: ${PD_DB_READONLY_PASSWORD:?set PD_DB_READONLY_PASSWORD}
  PD_DB_MEMORY_AI_PASSWORD: ${PD_DB_MEMORY_AI_PASSWORD:?set PD_DB_MEMORY_AI_PASSWORD}
  PD_REDIS_CLIENT: ${PD_REDIS_CLIENT:-predis}
  PD_REDIS_HOST: ${PD_REDIS_HOST:-pocket-dev-redis}
  PD_REDIS_PORT: ${PD_REDIS_PORT:-6379}
  PD_DOCKER_GID: ${PD_DOCKER_GID:?set PD_DOCKER_GID}
  PD_USER_ID: ${PD_USER_ID:-1000}
  PD_GROUP_ID: ${PD_GROUP_ID:-1000}

services:
  pocket-dev-php:
    build:
      # "." = repo root when Coolify sets --project-directory to clone root (not "..").
      context: .
      dockerfile: docker-laravel/production/php/Dockerfile
    restart: unless-stopped
    labels:
      - traefik.enable=false
    working_dir: /var/www
    env_file:
      - ../.env
    environment:
      <<: *pocketdev-env
      HOME: /home/appuser
      PD_TARGET_UID: ${PD_USER_ID:-1000}
      PD_TARGET_GID: ${PD_GROUP_ID:-1000}
    tmpfs:
      - /tmp
    volumes:
      - user-data:/home/appuser
      - workspace-data:/workspace
      - pocketdev-storage:/var/www/storage/pocketdev
      - type: volume
        source: shared-tmp
        target: /tmp/pocketdev
        volume:
          subpath: pocketdev
      - type: volume
        source: shared-tmp
        target: /tmp/pocketdev-uploads
        volume:
          subpath: pocketdev-uploads
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      pocket-dev-postgres:
        condition: service_healthy
      pocket-dev-redis:
        condition: service_healthy
    healthcheck:
      # php-fpm image has no pgrep/ps; php-fpm -t validates config (works before FPM starts).
      test: ["CMD-SHELL", "php-fpm -t || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 300s

  pocket-dev-nginx:
    build:
      context: .
      dockerfile: docker-laravel/production/nginx/Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      pocket-dev-php:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  pocket-dev-postgres:
    build:
      context: .
      dockerfile: docker-postgres/Dockerfile
    restart: unless-stopped
    labels:
      - traefik.enable=false
    environment:
      POSTGRES_DB: pocket-dev
      POSTGRES_USER: pocket-dev
      POSTGRES_PASSWORD: ${PD_DB_PASSWORD:?set PD_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pocket-dev -d pocket-dev"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  pocket-dev-redis:
    image: redis:7-alpine
    restart: unless-stopped
    labels:
      - traefik.enable=false
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  pocket-dev-queue:
    build:
      context: .
      dockerfile: docker-laravel/production/php/Dockerfile
    restart: unless-stopped
    labels:
      - traefik.enable=false
    working_dir: /var/www
    entrypoint: ["/queue-entrypoint.sh"]
    env_file:
      - ../.env
    environment:
      <<: *pocketdev-env
      HOME: /home/appuser
      PD_TARGET_UID: ${PD_USER_ID:-1000}
      PD_TARGET_GID: ${PD_GROUP_ID:-1000}
      PD_QUEUE_WORKERS: ${PD_QUEUE_WORKERS:-8}
    tmpfs:
      - /tmp
    volumes:
      - user-data:/home/appuser
      - workspace-data:/workspace
      - pocketdev-storage:/var/www/storage/pocketdev
      - type: volume
        source: shared-tmp
        target: /tmp/pocketdev
        volume:
          subpath: pocketdev
      - type: volume
        source: shared-tmp
        target: /tmp/pocketdev-uploads
        volume:
          subpath: pocketdev-uploads
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      pocket-dev-redis:
        condition: service_healthy
      pocket-dev-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "supervisorctl -c /etc/supervisor/conf.d/queue-workers.conf status | awk 'BEGIN{ok=1;count=0;sched=0} /^queue-worker_/ {count++; if ($2 != \"RUNNING\") ok=0} /^scheduler/ {sched++; if ($2 != \"RUNNING\") ok=0} END{if (count==0) ok=0; if (sched==0) ok=0; exit !ok}'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

volumes:
  postgres-data:
    name: ${PD_PROJECT_NAME:-pocket-dev}-postgres
  redis-data:
    name: ${PD_PROJECT_NAME:-pocket-dev}-redis
  workspace-data:
    name: ${PD_PROJECT_NAME:-pocket-dev}-workspace
  user-data:
    name: ${PD_PROJECT_NAME:-pocket-dev}-user
  pocketdev-storage:
    name: ${PD_PROJECT_NAME:-pocket-dev}-storage
  shared-tmp:
    name: ${PD_PROJECT_NAME:-pocket-dev}-shared-tmp
