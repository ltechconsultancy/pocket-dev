<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1f2937">
    <title>PocketDev - offline</title>
    <link rel="icon" href="/favicon.ico" sizes="any">
    <style>
        html, body { height: 100%; margin: 0; }
        body {
            background: #111827; color: #e5e7eb;
            font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; box-sizing: border-box;
        }
        img { width: 72px; height: 72px; margin-bottom: 20px; }
        h1 { font-size: 20px; margin: 0 0 8px; }
        p { color: #9ca3af; margin: 0 0 24px; line-height: 1.5; }
        button {
            background: #3b82f6; color: #fff; border: 0; border-radius: 8px;
            padding: 12px 24px; font-size: 15px; cursor: pointer;
        }
    </style>
</head>
<body>
    <div>
        <img src="/icons/icon-192.png" alt="">
        <h1>Geen verbinding met PocketDev</h1>
        <p>Je bent offline of de server is niet bereikbaar.<br>Je chats lopen op de server gewoon door.</p>
        <button onclick="location.reload()">Opnieuw proberen</button>
    </div>
    <script>window.addEventListener('online', () => location.reload());</script>
</body>
</html>
